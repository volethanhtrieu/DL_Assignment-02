<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 500" width="840" height="1000">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0b2a4a"/>
    </marker>
  </defs>
  <rect width="420" height="500" fill="#ffffff"/>
  <g font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="middle" fill="#0b2a4a">
    <!-- frame -->
    <text x="40" y="104" text-anchor="start" font-style="italic" font-size="15">Baseline</text>
    <rect x="40" y="112" width="340" height="300" fill="none" stroke="#0b2a4a" stroke-width="1.5"/>

    <rect x="80" y="20" width="260" height="50" fill="#ffffff" stroke="#0b2a4a" stroke-width="1.5"/>
    <text x="210" y="42" font-size="15">Input text</text>
    <text x="210" y="60" font-size="11" fill="#475569">text_min (NFC · lowercase · spaces)</text>

    <rect x="80" y="130" width="260" height="50" fill="#e6e6fa" stroke="#0b2a4a" stroke-width="1.5"/>
    <text x="210" y="152" font-size="15">N-gram extraction</text>
    <text x="210" y="170" font-size="11" fill="#475569">unigrams + bigrams</text>

    <rect x="80" y="210" width="260" height="50" fill="#e6e6fa" stroke="#0b2a4a" stroke-width="1.5"/>
    <text x="210" y="232" font-size="15">TF-IDF vector</text>
    <text x="210" y="250" font-size="11" fill="#475569">32,776 features · min_df 2 · max_df 0.9</text>

    <rect x="80" y="290" width="260" height="50" fill="#fdf3e1" stroke="#0b2a4a" stroke-width="1.5"/>
    <text x="210" y="312" font-size="15">Logistic Regression</text>
    <text x="210" y="330" font-size="11" fill="#475569">W: 6 × 32,776 + b · C = 1.0</text>

    <rect x="80" y="355" width="260" height="42" fill="#fde4ec"/>
    <text x="210" y="374" font-size="15">Softmax (6 classes)</text>
    <text x="210" y="390" font-size="11" fill="#475569">loss: balanced class weights</text>

    <text x="210" y="460" font-size="15">Output: 6 emotion scores</text>
    <text x="210" y="482" font-size="11" fill="#475569">196,662 parameters · fitted on train only · CPU</text>
  </g>
  <g stroke="#0b2a4a" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M210 70 V128"/>
    <path d="M210 180 V208"/>
    <path d="M210 260 V288"/>
    <path d="M210 340 V353"/>
    <path d="M210 397 V438"/>
  </g>
</svg>
