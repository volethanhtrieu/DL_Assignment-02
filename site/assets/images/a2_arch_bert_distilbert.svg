<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 580" width="1280" height="1160">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0b2a4a"/>
    </marker>
  </defs>
  <rect width="640" height="580" fill="#ffffff"/>
  <g font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="middle" fill="#0b2a4a">
    <!-- shared input -->
    <rect x="200" y="10" width="240" height="50" fill="#ffffff" stroke="#0b2a4a" stroke-width="1.5"/>
    <text x="320" y="32" font-size="15">Tokenized text</text>
    <text x="320" y="50" font-size="11" fill="#475569">WordPiece · identical ids · MAX_LEN 128</text>

    <!-- frames -->
    <text x="40" y="98" text-anchor="start" font-style="italic" font-size="15">BERT base</text>
    <text x="600" y="98" text-anchor="end" font-style="italic" font-size="15">DistilBERT</text>
    <rect x="40" y="105" width="250" height="390" fill="none" stroke="#0b2a4a" stroke-width="1.5"/>
    <rect x="350" y="105" width="250" height="390" fill="none" stroke="#0b2a4a" stroke-width="1.5"/>

    <!-- BERT column -->
    <rect x="65" y="120" width="200" height="40" fill="#e6e6fa" stroke="#0b2a4a" stroke-width="1.5"/>
    <text x="165" y="145" font-size="14">Embedding Layer</text>
    <rect x="65" y="180" width="200" height="35" fill="#fdf3e1" stroke="#0b2a4a" stroke-width="1.5"/>
    <text x="165" y="202" font-size="14">Transformer Layer 1</text>
    <rect x="65" y="235" width="200" height="35" fill="#fdf3e1" stroke="#0b2a4a" stroke-width="1.5"/>
    <text x="165" y="257" font-size="14">Transformer Layer 2</text>
    <text x="165" y="306" font-size="14">…</text>
    <rect x="65" y="320" width="200" height="35" fill="#fdf3e1" stroke="#0b2a4a" stroke-width="1.5"/>
    <text x="165" y="342" font-size="14">Transformer Layer 12</text>
    <text x="172" y="374" text-anchor="start" font-size="11" fill="#475569">[CLS] vector, 768</text>
    <rect x="65" y="385" width="200" height="35" fill="#e6fbe6" stroke="#0b2a4a" stroke-width="1.5"/>
    <text x="165" y="401" font-size="13">Pooler 768→768, tanh</text>
    <text x="165" y="414" font-size="10" fill="#475569">pretrained</text>
    <rect x="65" y="440" width="200" height="35" fill="#fde4ec"/>
    <text x="165" y="456" font-size="13">classifier 768→6</text>
    <text x="165" y="469" font-size="10" fill="#475569">new · 4,614 params</text>

    <!-- DistilBERT column -->
    <rect x="375" y="120" width="200" height="40" fill="#e6e6fa" stroke="#0b2a4a" stroke-width="1.5"/>
    <text x="475" y="145" font-size="14">Embedding Layer</text>
    <rect x="375" y="180" width="200" height="35" fill="#fdf3e1" stroke="#0b2a4a" stroke-width="1.5"/>
    <text x="475" y="202" font-size="14">Transformer Layer 1</text>
    <rect x="375" y="235" width="200" height="35" fill="#fdf3e1" stroke="#0b2a4a" stroke-width="1.5"/>
    <text x="475" y="257" font-size="14">Transformer Layer 2</text>
    <text x="475" y="306" font-size="14">…</text>
    <rect x="375" y="320" width="200" height="35" fill="#fdf3e1" stroke="#0b2a4a" stroke-width="1.5"/>
    <text x="475" y="342" font-size="14">Transformer Layer 6</text>
    <text x="482" y="374" text-anchor="start" font-size="11" fill="#475569">[CLS] vector, 768</text>
    <rect x="375" y="385" width="200" height="35" fill="#fde4ec"/>
    <text x="475" y="401" font-size="13">pre_classifier 768→768, ReLU</text>
    <text x="475" y="414" font-size="10" fill="#475569">new</text>
    <rect x="375" y="440" width="200" height="35" fill="#fde4ec"/>
    <text x="475" y="456" font-size="13">classifier 768→6</text>
    <text x="475" y="469" font-size="10" fill="#475569">new · head total 595,206 params</text>

    <!-- distillation -->
    <text x="320" y="190" font-size="11">distillation</text>
    <text x="320" y="300" font-size="14">…</text>

    <!-- outputs -->
    <text x="165" y="540" font-size="15">Output: 6 emotion scores</text>
    <text x="165" y="560" font-size="11" fill="#475569">109,486,854 parameters · 418 MB</text>
    <text x="475" y="540" font-size="15">Output: 6 emotion scores</text>
    <text x="475" y="560" font-size="11" fill="#475569">66,958,086 parameters · 256 MB</text>
  </g>
  <g stroke="#0b2a4a" stroke-width="1.5" fill="none">
    <path d="M320 60 V78 H165 V118" marker-end="url(#arrow)"/>
    <path d="M320 78 H475 V118" marker-end="url(#arrow)"/>
    <g marker-end="url(#arrow)">
      <path d="M165 160 V178"/><path d="M165 215 V233"/><path d="M165 270 V290"/><path d="M165 312 V318"/>
      <path d="M165 355 V383"/><path d="M165 420 V438"/><path d="M165 475 V520"/>
      <path d="M475 160 V178"/><path d="M475 215 V233"/><path d="M475 270 V290"/><path d="M475 312 V318"/>
      <path d="M475 355 V383"/><path d="M475 420 V438"/><path d="M475 475 V520"/>
      <path d="M268 197 H372"/><path d="M268 252 H372"/><path d="M268 337 H372"/>
    </g>
  </g>
</svg>
